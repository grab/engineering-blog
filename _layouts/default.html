<!DOCTYPE html>
<html>
  {% include head.html %}
  <body>
    {% include header.html %}
    <div class="page-content">
      {{ content }}
    </div>
    {% include buttons/back-to-top.html %}
    {% include footer.html %}
    {% include components/search-index-data.html %}

    <div class="blog-search-modal" id="blog-search-modal" role="dialog" aria-modal="true" aria-label="Search articles" hidden>
      <div class="blog-search-modal-backdrop" data-blog-search-close></div>
      <div class="blog-search-dialog" id="blog-search-dialog" role="document">
        <form action="/search.html" role="search" class="blog-search-form" id="blog-search-form">
          <svg class="blog-search-input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="11" cy="11" r="7"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <input
            type="search"
            name="q"
            id="blog-search-input"
            class="blog-search-input"
            placeholder="Search articles..."
            autocomplete="off"
            aria-autocomplete="list"
            aria-controls="blog-search-results"
            aria-expanded="false"
            aria-label="Search articles"
          >
          <kbd class="blog-search-kbd">Esc</kbd>
        </form>
        <div id="blog-search-results" class="blog-search-results" role="listbox" aria-label="Search results"></div>
        <div class="blog-search-footer">
          <span class="blog-search-footer-hint">Enter opens top result &middot; Esc closes</span>
          <a href="/search.html" class="blog-search-full-link" id="blog-search-full-link" hidden>Search all articles</a>
        </div>
      </div>
    </div>

    <script src="/js/blog-search.js" defer></script>
    {% include ga.html %}
  </body>
</html>
