---
layout: default
body_class: instrument-shell
---
<script id="glow-grid-settings" type="application/json">
{% include glow-grid-settings.json %}
</script>
<script src="/js/glow-grid.js" defer></script>
<div class="wrapper home-page-wrapper">
  <main class="home-main archive-main">
    <header class="archive-page-header">
      <h1 class="post-grid-heading archive-page-title">{{ page.title }}</h1>
      <p class="archive-intro">Browse all {{ page.title }} articles on {{ site.title }}.</p>
    </header>
    <div class="post-grid-section">
      <div class="post-grid">
        {% for post in page.posts %}
          {% include components/post-card.html post=post %}
        {% endfor %}
      </div>
    </div>
  </main>
</div>
