<div class="blog-search" id="blog-search-container">
  <button
    type="button"
    class="blog-search-trigger"
    id="blog-search-trigger"
    aria-haspopup="dialog"
    aria-expanded="false"
    aria-controls="blog-search-modal"
    aria-label="Open search"
  >
    <svg class="blog-search-trigger-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle cx="11" cy="11" r="7"></circle>
      <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
    </svg>
    <kbd class="blog-search-kbd" data-blog-search-shortcut>Ctrl K</kbd>
  </button>
</div>
