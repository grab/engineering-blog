{% assign share_url = page.url | absolute_url %}
{% assign share_title = page.title | uri_escape %}
{% assign share_summary = page.excerpt | strip_html | strip_newlines | uri_escape %}

<div class="sharing-links share-bar" role="group" aria-label="Share this article">
  <span class="share-bar-label">Share</span>
  <div class="share-bar-actions">
    <button
      type="button"
      class="share-btn share-btn-copy"
      id="share-copy-link"
      data-share-url="{{ share_url }}"
      aria-label="Copy link to this article"
    >
      <svg class="share-btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
        <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
      </svg>
      <span class="share-btn-text">Copy link</span>
    </button>

    <a
      href="https://twitter.com/intent/tweet?text={{ share_title }}&amp;url={{ share_url | uri_escape }}&amp;via={{ site.social_media.twitter }}&amp;related={{ site.social_media.twitter }}"
      class="share-btn share-btn-icon share-btn-x"
      data-share-popup
      rel="nofollow noopener"
      target="_blank"
      aria-label="Share on X"
      title="Share on X"
    >
      <i class="fa fa-twitter" aria-hidden="true"></i>
    </a>

    <a
      href="https://www.linkedin.com/shareArticle?mini=true&amp;url={{ share_url | uri_escape }}&amp;title={{ share_title }}&amp;summary={{ share_summary }}&amp;source={{ site.title | uri_escape }}"
      class="share-btn share-btn-icon share-btn-linkedin"
      data-share-popup
      rel="nofollow noopener"
      target="_blank"
      aria-label="Share on LinkedIn"
      title="Share on LinkedIn"
    >
      <i class="fa fa-linkedin" aria-hidden="true"></i>
    </a>

    <a
      href="https://facebook.com/sharer.php?u={{ share_url | uri_escape }}"
      class="share-btn share-btn-icon share-btn-facebook"
      data-share-popup
      rel="nofollow noopener"
      target="_blank"
      aria-label="Share on Facebook"
      title="Share on Facebook"
    >
      <i class="fa fa-facebook" aria-hidden="true"></i>
    </a>
  </div>
  <span class="share-copy-feedback" id="share-copy-feedback" role="status" aria-live="polite" hidden>Link copied</span>
</div>
<script src="/js/share-links.js" defer></script>
